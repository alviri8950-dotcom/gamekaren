{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آپدیت بازی‌ها - گیم کارن</title>
    <link rel="icon" type="image/jpeg" href="{% static 'images/app-icon.jpeg' %}">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
            color: #ffffff;
            padding: 24px 16px 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            color: #38bdf8;
        }

        .back-link {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background: #334155;
            padding: 10px 18px;
            border-radius: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 22px;
        }

        .box h2 {
            margin-top: 0;
            color: #7dd3fc;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 17px;
            font-weight: bold;
            padding: 14px;
            cursor: pointer;
        }

        .submit-btn.secondary {
            background: #22c55e;
        }

        .hint {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.18);
            border: 1px solid #22c55e;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid #ef4444;
        }

        .message.info {
            background: rgba(59, 130, 246, 0.18);
            border: 1px solid #3b82f6;
        }

        .table-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 22px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 12px 10px;
            text-align: right;
            border-bottom: 1px solid #334155;
            vertical-align: middle;
        }

        th {
            color: #7dd3fc;
        }

        .inline-form {
            display: inline-block;
            margin: 0;
        }

        .small-btn {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            color: #ffffff;
        }

        .save-btn {
            background: #2563eb;
        }

        .delete-btn {
            background: #dc2626;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            background: #334155;
            color: #e2e8f0;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .page-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1 class="page-title">آپدیت بازی‌ها</h1>
            <a href="{% url 'game_index' %}" class="back-link">بازگشت به منوی اصلی</a>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="grid">
            <div class="box">
                <h2>افزودن دستی بازی</h2>
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="manual_add">

                    <div class="form-group">
                        <label for="name">
