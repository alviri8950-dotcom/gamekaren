<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود کالا</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 30px;
        }
        .box {
            max-width: 700px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #334155;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
        }
        input {
            background: #f8fafc;
            color: #0f172a;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>ورود کالا</h1>
        <p>اسکنر/ورود کالا فعلاً فعال است.</p>

        <input type="text" placeholder="بارکد کالا">
        <input type="text" placeholder="نام کالا">
        <input type="number" placeholder="تعداد">
        <button type="button">ثبت کالا</button>

        <p style="margin-top:20px;">
            <a href="/">بازگشت به منو</a>
        </p>
    </div>
</body>
</html>
